<title>גלגל הזוגות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Evening palette: aubergine ground, rose accent, warm cream type.
   One committed visual world — every color is painted explicitly so the
   page holds on any host background. */
:root{
  --ink:#1b0f1c; --ink-2:#271428; --card:#33193440; --line:#4a2a4c;
  --cream:#f6ebe4; --muted:#b6a0b4; --rose:#e0577f; --rose-2:#a83359;
  --gold:#d9a441; --good:#5fbf9a;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0; padding:16px 16px calc(24px + var(--safe-b));
  background:
    radial-gradient(90% 55% at 50% 0%, #3d1c3d 0%, transparent 62%),
    radial-gradient(70% 40% at 80% 100%, #2a1430 0%, transparent 60%),
    var(--ink);
  min-height:100dvh;
  color:var(--cream); font-family:Assistant,system-ui,Arial,sans-serif; direction:rtl;
  overscroll-behavior-y:contain;
}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:"Suez One",Georgia,serif;font-weight:400;font-size:2rem;line-height:1.15;margin:0;text-wrap:balance}
.eyebrow{font-size:.7rem;letter-spacing:.24em;color:var(--rose);margin:0 0 6px}
.muted{color:var(--muted)}
.panel{background:linear-gradient(180deg,#2c1630,#241128);border:1px solid var(--line);border-radius:16px;padding:16px}

/* header */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.room{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#2a1430;color:var(--cream);
  font:inherit;font-size:.88rem}
.room b{letter-spacing:.24em;color:var(--gold)}
.score{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:#2a1430;font-size:.82rem;white-space:nowrap}
.pill.turn{border-color:var(--rose);background:rgba(224,87,127,.14);color:var(--cream)}
.pill b{font-variant-numeric:tabular-nums;color:var(--gold)}

/* wheel */
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
.wheelbox{position:relative;width:min(78vw,320px);aspect-ratio:1}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:3;
  width:0;height:0;border-inline:13px solid transparent;border-top:22px solid var(--gold);
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
canvas{width:100%;height:100%;display:block;border-radius:50%;
  box-shadow:0 18px 44px rgba(0,0,0,.55), 0 0 0 8px #2a1430, 0 0 0 10px var(--line);
  transition:transform 4.6s cubic-bezier(.13,.72,.14,1)}
@media (prefers-reduced-motion:reduce){canvas{transition-duration:1.2s}}
.cap{position:absolute;inset:38%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a2450,#20101f);
  border:2px solid var(--line);display:grid;place-items:center;z-index:2;font-size:1.6rem;pointer-events:none}

.callout{text-align:center;font-size:1.05rem;min-height:1.5em;margin:0}
.callout b{color:var(--rose)}

/* task card */
.task{border:1px solid var(--rose-2);border-radius:18px;padding:20px 18px;
  background:linear-gradient(180deg,rgba(224,87,127,.16),rgba(224,87,127,.05));
  display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.task .icon{font-size:2.4rem;line-height:1}
.task .cat{font-size:.72rem;letter-spacing:.22em;color:var(--rose)}
.task p{margin:0;font-family:"Suez One",Georgia,serif;font-size:1.28rem;line-height:1.45;text-wrap:balance}
.task .who{font-size:.9rem;color:var(--muted)}

/* level dial */
.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.level{padding:11px 6px;border-radius:12px;border:1px solid var(--line);background:#2a1430;color:var(--cream);
  font:inherit;font-weight:600;font-size:.92rem;line-height:1.3}
.level small{display:block;font-weight:400;font-size:.68rem;color:var(--muted);margin-top:2px}
.level[aria-pressed="true"]{background:linear-gradient(180deg,var(--rose),var(--rose-2));border-color:var(--rose-2);color:#fff}
.level[aria-pressed="true"] small{color:rgba(255,255,255,.82)}

/* controls */
.actions{display:grid;gap:9px}
.btn{width:100%;padding:16px;border-radius:14px;border:1px solid var(--line);background:#2a1430;color:var(--cream);
  font:inherit;font-weight:700;font-size:1.02rem}
.btn.rose{background:linear-gradient(180deg,var(--rose),var(--rose-2));border-color:var(--rose-2);color:#fff}
.btn.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0;border:0;background:none}
.btn[disabled]{opacity:.4}
.btn:focus-visible,.level:focus-visible,.room:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input{width:100%;padding:15px;border-radius:14px;border:1px solid var(--line);background:#2a1430;color:var(--cream);
  font:inherit;font-size:1.05rem}
#code{text-align:center;letter-spacing:.45em;font-size:1.5rem;text-transform:uppercase;font-family:"Suez One",Georgia,serif}
.or{text-align:center;color:var(--muted);font-size:.74rem;letter-spacing:.22em;margin:2px 0}
.note{font-size:.84rem;color:var(--muted);text-align:center;min-height:1.2em;margin:0}
.link{display:flex;align-items:center;gap:7px;justify-content:center;font-size:.78rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#6b5569;flex:none}
.dot.on{background:var(--good)}
.dot.bad{background:var(--rose)}
.log{display:flex;flex-direction:column;gap:5px;font-size:.82rem;color:var(--muted)}
.log div{display:flex;gap:7px;align-items:baseline}
.log b{color:var(--cream);font-weight:600}
button{cursor:pointer;font-family:inherit}

/* waiting room */
.waiting{text-align:center;border-color:var(--rose-2);
  background:linear-gradient(180deg,rgba(224,87,127,.14),rgba(224,87,127,.04))}
.bigcode{font-family:"Suez One",Georgia,serif;font-size:2.6rem;letter-spacing:.3em;
  color:var(--gold);margin:6px 0 10px;padding-inline-start:.3em}

.genders{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.label{font-size:.7rem;letter-spacing:.22em;color:var(--muted)}

.heat{text-align:center;border-color:var(--rose-2);padding:12px;
  background:linear-gradient(180deg,rgba(224,87,127,.12),rgba(224,87,127,.03))}
.heat .eyebrow{letter-spacing:.3em}

.version{margin:0;text-align:center;font-size:.72rem;letter-spacing:.14em;color:var(--muted);opacity:.7;
  font-variant-numeric:tabular-nums}
</style>

<script>
'use strict';
/*
 * קול הגלגל — מסונתז ב-Web Audio, בלי קבצים חיצוניים.
 * הטיקים מתוזמנים לפי אותה עקומת האטה של האנימציה, כך שהם מתקרבים
 * ומאטים בדיוק כמו הגלגל, ונעצרים ברגע שהוא נעצר.
 */
const Sound = (() => {
  const EASE = [0.13, 0.72, 0.14, 1];   // must match the canvas transition
  let ctx = null;
  let on = true;
  try { on = localStorage.getItem('wheel.sound') !== 'off'; } catch {}

  // cubic-bezier(x1,y1,x2,y2) — progress at time fraction t
  const bez = (a, b, t) => {
    const u = 1 - t;
    return 3 * u * u * t * a + 3 * u * t * t * b + t * t * t;
  };
  // time fraction at which the wheel has turned `p` of the way
  const timeAt = (p) => {
    let lo = 0, hi = 1;
    for (let i = 0; i < 24; i++) {
      const mid = (lo + hi) / 2;
      if (bez(EASE[1], EASE[3], mid) < p) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  };

  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();   // iOS unlocks only inside a gesture
    return ctx;
  }

  // one flapper click: a short filtered noise burst
  function tick(at, gain) {
    const c = ctx, dur = 0.045;
    const buf = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 3;
    const src = c.createBufferSource(); src.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = 2.5;
    const g = c.createGain(); g.gain.value = gain;
    src.connect(bp).connect(g).connect(c.destination);
    src.start(at);
  }

  function chime(at) {
    const c = ctx;
    [660, 990].forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0, at + i * 0.09);
      g.gain.linearRampToValueAtTime(0.16, at + i * 0.09 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, at + i * 0.09 + 0.5);
      o.connect(g).connect(c.destination);
      o.start(at + i * 0.09); o.stop(at + i * 0.09 + 0.55);
    });
  }

  return {
    get on() { return on; },
    toggle() {
      on = !on;
      try { localStorage.setItem('wheel.sound', on ? 'up' : 'off'); } catch {}
      if (on) { const c = audio(); if (c) chime(c.currentTime + 0.02); }
      return on;
    },
    // call on the spin gesture: schedules the whole run at once
    spin(ms, slices) {
      if (!on) return;
      const c = audio();
      if (!c) return;
      const t0 = c.currentTime + 0.02;
      const clicks = Math.min(90, Math.max(8, Math.round(4.5 * slices)));
      for (let j = 1; j <= clicks; j++) {
        const t = timeAt(j / clicks);
        tick(t0 + t * (ms / 1000), 0.06 + 0.16 * (1 - t));   // loud and fast, then sparse and soft
      }
      chime(t0 + ms / 1000 + 0.05);
    },
  };
})();

</script>
<script>
(() => {
  'use strict';
  const SPIN_MS = 4700;
  let names = ['', ''], genders = ['m', 'f'];
  let turn = 0, round = 1, phase = 'setup', rotation = 0, task = null;
  let score = [0, 0], log = [], used = [], board = [];

  const KEY = 'wheel.solo';
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(
    { names, genders, turn, round, phase: phase === 'spinning' ? 'task' : phase, rotation, task, score, log, used, board })); } catch {} };
  const restore = () => {
    try {
      const d = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!d || !d.names || !d.names[0]) return false;
      ({ names, genders, turn, round, phase, rotation, task, score, log, used, board } = d);
      return true;
    } catch { return false; }
  };

  const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const app = () => document.getElementById('app');

  // {זכר|נקבה} נוטה לפי מי שמבצע/ת, [זכר|נקבה] לפי בן/בת הזוג
  const fill = (text, you, them, gYou, gThem) =>
    text.replace(/\{([^{}|]*)\|([^{}|]*)\}/g, (m, a, b) => gYou === 'f' ? b : a)
        .replace(/\[([^\[\]|]*)\|([^\[\]|]*)\]/g, (m, a, b) => gThem === 'f' ? b : a)
        .replace(/\{you\}/g, you).replace(/\{them\}/g, them);

  const taskId = (key, i) => key + ':' + i;
  const segOf = key => SEGMENTS.find(sg => sg.key === key) || SEGMENTS[0];

  // every task not performed yet — one pool, no levels
  const poolOf = () => SEGMENTS.flatMap(sg =>
    TASKS[sg.key].map((t, i) => ({ ...t, key: sg.key, id: taskId(sg.key, i) }))
      .filter(t => !used.includes(t.id)));

  // deal a fresh wheel: up to one task per category
  function deal() {
    const from = poolOf();
    const out = [];
    for (const sg of SEGMENTS) {
      const mine = from.filter(t => t.key === sg.key);
      if (mine.length) out.push(mine[Math.floor(Math.random() * mine.length)]);
    }
    const rest = from.filter(t => !out.some(b => b.id === t.id));
    while (out.length < 8 && rest.length) out.push(rest.splice(Math.floor(Math.random() * rest.length), 1)[0]);
    return out.sort(() => Math.random() - 0.5);
  }

  function drawWheel() {
    const cv = document.getElementById('wheel');
    if (!cv) return;
    const slices = board.length ? board : SEGMENTS.map(sg => ({ key: sg.key }));
    const n = slices.length;
    const S = 640, R = S / 2, ctx = cv.getContext('2d');
    cv.width = S; cv.height = S;
    ctx.clearRect(0, 0, S, S);
    if (!n) return;
    const step = (Math.PI * 2) / n;
    slices.forEach((slice, i) => {
      const sg = segOf(slice.key);
      const a0 = -Math.PI / 2 + i * step;
      ctx.beginPath(); ctx.moveTo(R, R); ctx.arc(R, R, R - 4, a0, a0 + step); ctx.closePath();
      ctx.fillStyle = sg.hue; ctx.fill();
      ctx.strokeStyle = 'rgba(27,15,28,.55)'; ctx.lineWidth = 4; ctx.stroke();
      ctx.save(); ctx.translate(R, R); ctx.rotate(a0 + step / 2);
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
      ctx.font = '600 ' + (n > 6 ? 34 : 40) + 'px Assistant, system-ui, sans-serif';
      ctx.fillText(sg.label, R - 74, 0);
      ctx.font = (n > 6 ? 40 : 46) + 'px system-ui, sans-serif';
      ctx.fillText(sg.icon, R - 26, 2);
      ctx.restore();
    });
  }

  function spin() {
    if (!board.length) board = deal();
    if (!board.length) { phase = 'done'; render(); return; }

    const n = board.length;
    const seg = Math.floor(Math.random() * n);
    const pickd = board[seg];
    const sg = segOf(pickd.key);

    task = { id: pickd.id, icon: sg.icon, cat: sg.label,
      text: fill(pickd.text, names[turn], names[1 - turn], genders[turn], genders[1 - turn]) };

    const step = 360 / n;
    const target = ((-step * seg - step / 2) % 360 + 360) % 360;
    const now = ((rotation % 360) + 360) % 360;
    rotation += 4 * 360 + ((target - now) + 360) % 360;

    phase = 'spinning'; render(); save();
    Sound.spin(SPIN_MS, n);
    const cv = document.getElementById('wheel');
    if (cv) requestAnimationFrame(() => { cv.style.transform = `rotate(${rotation}deg)`; });
    setTimeout(() => { phase = 'task'; render(); save(); }, SPIN_MS);
  }

  function finish(done) {
    if (done) {
      score[turn] += 1;
      log = [{ name: names[turn], icon: task.icon, text: task.text }, ...log].slice(0, 4);
      used = [...used, task.id];                 // performed — gone for good
    }
    board = board.filter(b => b.id !== task.id); // either way the slice leaves the wheel
    turn = 1 - turn; round += 1;
    if (!board.length) board = deal();
    phase = board.length ? 'idle' : 'done';
    task = null; render(); save();
  }

  const wheelBox = icon => `<div class="wheelbox"><div class="pointer"></div>
    <canvas id="wheel"></canvas><div class="cap">${icon}</div></div>`;

  const genderPicker = (i) => `<div class="genders">
    <button class="level" data-who="${i}" data-g="m" aria-pressed="${genders[i] === 'm'}">לשון זכר</button>
    <button class="level" data-who="${i}" data-g="f" aria-pressed="${genders[i] === 'f'}">לשון נקבה</button>
  </div>`;

  function render() {
    if (phase === 'setup') {
      app().innerHTML = `
        <div class="stage">${wheelBox('💞')}</div>
        <div class="panel">
          <p class="eyebrow">משחק לשניים · טלפון אחד</p>
          <h1>גלגל הזוגות</h1>
          <p class="muted" style="margin:10px 0 16px">מסובבים, הגלגל נוחת על משימה — ומבצעים. מעבירים את הטלפון בכל תור. משימה שבוצעה יורדת מהגלגל.</p>
          <input id="n0" maxlength="14" placeholder="השם שלך" value="${esc(names[0])}">
          ${genderPicker(0)}
          <div style="height:14px"></div>
          <input id="n1" maxlength="14" placeholder="השם של בן/בת הזוג" value="${esc(names[1])}">
          ${genderPicker(1)}
          <div class="actions" style="margin-top:14px"><button class="btn rose" id="btnGo">מתחילים</button></div>
        </div>`;
      drawWheel();
      app().querySelectorAll('.genders .level').forEach(b => b.onclick = () => {
        names = [document.getElementById('n0').value, document.getElementById('n1').value];
        genders[+b.dataset.who] = b.dataset.g;
        render();
      });
      document.getElementById('btnGo').onclick = () => {
        names = [document.getElementById('n0').value.trim() || 'שחקן',
                 document.getElementById('n1').value.trim() || 'שחקנית'];
        board = deal(); phase = 'idle'; render(); save();
      };
      return;
    }

    const left = 64 - used.length;
    const callout = phase === 'spinning' ? 'הגלגל מסתובב…'
      : phase === 'task' ? `המשימה של <b>${esc(names[turn])}</b>`
      : phase === 'done' ? 'עברתם על הכל'
      : `התור של <b>${esc(names[turn])}</b> — העבירו את הטלפון`;

    app().innerHTML = `
      <div class="topbar">
        <button class="room" id="btnReset">משחק חדש</button>
        <button class="room" id="btnSound" title="קול">${Sound.on ? '🔊' : '🔇'}</button>
        <div class="score">${names.map((n, i) =>
          `<span class="pill${i === turn ? ' turn' : ''}">${esc(n)} <b>${score[i]}</b></span>`).join('')}</div>
      </div>

      <div class="stage">
        ${wheelBox(phase === 'task' && task ? task.icon : '💞')}
        <p class="callout">${callout}</p>
      </div>

      ${phase === 'task' && task ? `
        <div class="task">
          <div class="icon">${task.icon}</div>
          <p class="cat">${esc(task.cat)}</p>
          <p>${esc(task.text)}</p>
          <p class="who">סיבוב ${round}</p>
        </div>
        <div class="actions"><div class="btn two">
          <button class="btn rose" id="btnDone">בוצע ✔</button>
          <button class="btn" id="btnSkip">דלגו</button>
        </div></div>`
      : phase === 'done' ? `
        <div class="panel waiting">
          <p class="eyebrow">הגלגל נגמר</p>
          <p class="muted" style="margin:0">עברתם על כל המשימות. אפשר להתחיל מחדש — או להפסיק לשחק.</p>
          <button class="btn rose" id="btnAgain" style="margin-top:12px">מהתחלה</button>
        </div>` : `
        <div class="actions">
          <button class="btn rose" id="btnSpin" ${phase === 'spinning' ? 'disabled' : ''}>
            ${phase === 'spinning' ? 'מסתובב…' : 'סובבו את הגלגל'}</button>
        </div>`}

      <div class="panel heat">
        <p class="eyebrow" style="margin:0">${HEAT}</p>
        <p class="muted" style="margin:6px 0 0">${board.length} על הגלגל · ${left} משימות נשארו</p>
      </div>

      ${log.length ? `<div class="log">${log.map(l =>
        `<div><span>${l.icon}</span><b>${esc(l.name)}</b><span>${esc(l.text)}</span></div>`).join('')}</div>` : ''}
      <p class="version">גרסה ${APP_VERSION}</p>`;

    drawWheel();
    const cv = document.getElementById('wheel');
    if (cv && phase !== 'spinning') {
      cv.style.transition = 'none';
      cv.style.transform = `rotate(${rotation}deg)`;
      void cv.offsetWidth;
      cv.style.transition = '';
    }
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    const restart = () => { score = [0, 0]; log = []; used = []; board = deal();
      round = 1; turn = 0; phase = 'idle'; task = null; render(); save(); };
    on('btnSpin', spin);
    on('btnDone', () => finish(true));
    on('btnSkip', () => finish(false));
    on('btnAgain', restart);
    on('btnSound', () => { Sound.toggle(); render(); });
    on('btnReset', () => { restart(); phase = 'setup'; render(); });
  }

  restore();
  render();
})();

</script>
